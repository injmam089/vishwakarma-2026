version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: landsafe-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-landsafe}
      POSTGRES_USER: ${POSTGRES_USER:-landsafe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-landsafe_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-landsafe} -d ${POSTGRES_DB:-landsafe}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
